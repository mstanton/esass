[project]
name = "esass-prototype"
version = "0.1.0"
description = "Emergent Self-Adaptive Skill System - Prototype"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "python-dateutil>=2.8",
]

[project.scripts]
esass = "esass_prototype.cli:esass"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["esass_prototype"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = []
