[project]
name = "esass-prototype"
version = "0.1.0"
description = "Emergent Self-Adaptive Skill System - Prototype"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "python-dateutil>=2.8",
]

[project.scripts]
esass = "esass_prototype.cli:esass"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["esass_prototype"]
