[project]
name = "esass"
version = "0.3.3"
description = "ESASS - Emergent Self-Adaptive Skill System"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = [
    "click>=8.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.70.0",
    "pywinpty>=2.0.10; sys_platform == 'win32'",
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
]
mcp = [
    "mcp>=1.0.0",
    "huggingface_hub>=0.20.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
all = [
    "esass[tui]",
    "esass[mcp]",
]

[project.scripts]
esass = "esass.cli.main:esass"
esass-mcp-server = "esass.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/esass"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
